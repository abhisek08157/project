<div class="login-page">
  <div *ngIf="!selectedRole" class="role-select-card">
    <h1 class="app-title">SmartBiz</h1>
    <p class="app-tagline">
      📘 A role-based digital ledger for managing customers, products, and reports.
    </p>
    <div class="role-buttons">
      <button (click)="selectedRole = 'Admin'">Login as Admin</button>
      <button (click)="selectedRole = 'Employee'">Login as Employee</button>
    </div>
  </div>

  <div *ngIf="selectedRole" class="login-card">
    <h2>{{ selectedRole }} Login</h2>
    <form (ngSubmit)="onLogin()">
      <input [(ngModel)]="username" name="username" placeholder="Username" required />
      <input [(ngModel)]="password" name="password" type="password" placeholder="Password" required />
      <button type="submit">Login</button>
      <p class="error" *ngIf="errorMsg">{{ errorMsg }}</p>
    </form>
    <button class="back-btn" (click)="selectedRole = ''">⬅ Back</button>
  </div>
</div>
